<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prospect Tenant Platform</title>
<link rel="icon" type="image/png" href="logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#EDF0F2; --surface:#FFFFFF; --sunk:#F6F7F8; --ink:#16212C; --muted:#56636F; --line:#D8DEE4;
  --navy:#1F4E78; --navy-d:#163A5A; --navy-l:#E3ECF5; --amber:#9A5B00; --amber-l:#FFF1DC; --red:#A63A1C; --red-l:#FBE7E1;
  --green:#226B45; --green-l:#E1F2E8;
  --r:10px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#11171D; --surface:#1A222B; --sunk:#151C23; --ink:#E7ECF1; --muted:#9AA7B4; --line:#2C3743;
  --navy:#7DB0E0; --navy-d:#A8CBEC; --navy-l:#1F3346; --amber:#F2B45A; --amber-l:#3A2C14; --red:#F08E70; --red-l:#3B2019; --green:#7CCB9D; --green-l:#17322A;
}}
:root[data-theme="dark"]{
  --ground:#11171D; --surface:#1A222B; --sunk:#151C23; --ink:#E7ECF1; --muted:#9AA7B4; --line:#2C3743;
  --navy:#7DB0E0; --navy-d:#A8CBEC; --navy-l:#1F3346; --amber:#F2B45A; --amber-l:#3A2C14; --red:#F08E70; --red-l:#3B2019; --green:#7CCB9D; --green-l:#17322A;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 'IBM Plex Sans Thai','Noto Sans Thai','Leelawadee UI',Tahoma,sans-serif;font-variant-numeric:tabular-nums}
a{color:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{font-weight:700;font-size:17px;padding:4px 10px 18px;line-height:1.3}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.brandlogo{display:block;width:150px;height:auto;margin:0 0 12px}
.brand span{display:block;font-size:14.5px}
.brand.nologo picture{display:none}
.brand.nologo span{font-size:17px}
.nav a{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 12px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:14.5px}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--navy-l);color:var(--navy);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.badge{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;font-size:12px;padding:0 7px;line-height:20px;font-weight:600}
.side-foot{margin-top:auto;font-size:13px;color:var(--muted);padding:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.main{min-width:0;padding:28px 32px 80px}
.topline{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.topline h1{margin:0;font-size:26px;line-height:1.25;font-weight:700;flex:1 1 auto}
.sub{color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14.5px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
:root[data-theme="dark"] .btn.pri{color:#0F1A24}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn.pri{color:#0F1A24} }
.btn.pri:hover{background:var(--navy-d)}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel h2{margin:0 0 14px;font-size:16px;font-weight:700}
.grid{display:grid;gap:16px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13.5px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0F1A24}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0F1A24} }
.chips{display:flex;flex-wrap:wrap;gap:6px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:12px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-Prospected{background:var(--navy-l);color:var(--navy)}
.st-Inspected{background:#DFF0F0;color:#14605F}
.st-Follow-Up{background:#E8E5F7;color:#4A3F94}
.st-Negotiation{background:var(--amber-l);color:var(--amber)}
.st-Closed-Deal{background:var(--green-l);color:var(--green)}
.st-Lost{background:var(--red-l);color:var(--red)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .st-Inspected{background:#163332;color:#7FD3CF} :root:not([data-theme="light"]) .st-Follow-Up{background:#2A2644;color:#B9B0F2} }
:root[data-theme="dark"] .st-Inspected{background:#163332;color:#7FD3CF}
:root[data-theme="dark"] .st-Follow-Up{background:#2A2644;color:#B9B0F2}
label.f,.f{display:flex;flex-flow:row wrap;align-content:flex-start;align-items:baseline;gap:5px 4px;min-width:0;font-size:13px;font-weight:600}
.f>*:not(.req){flex:1 1 100%;min-width:0}
.in{width:100%;min-height:42px;padding:0 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:14.5px;font-weight:400}
textarea.in{padding:9px 11px;min-height:84px;resize:vertical}
.in.err{border-color:var(--red)}
.hint{font-size:12.5px;color:var(--muted);font-weight:400}
.req{color:var(--red)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk);position:sticky;top:0}
th button{all:unset;cursor:pointer}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
.num{text-align:right}
.muted{color:var(--muted)}
.late{color:var(--red);font-weight:600}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:8px;font-size:14px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.demo{background:var(--amber-l);color:var(--amber);font-size:13px;padding:8px 12px;border-radius:8px;line-height:1.4}
dialog{border:none;border-radius:14px;padding:0;width:min(520px,calc(100vw - 32px));background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog.wide{width:min(680px,calc(100vw - 32px))}
.chg{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:8px}
.chg table{font-size:13.5px}
.chg td{padding:7px 10px}
.chg .old{color:var(--muted);text-decoration:line-through}
.fx{margin:0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:3px}
dialog::backdrop{background:rgba(10,20,30,.45)}
.dlg{padding:22px;display:flex;flex-direction:column;gap:14px}
.dlg h2{margin:0;font-size:18px}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.kpi:hover{border-color:var(--navy)}
.kpi b{font-size:30px;line-height:1.15;font-weight:700}
.kpi span{font-size:13.5px;color:var(--muted)}
.kpi.warn b{color:var(--red)}
.horizon{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.hz{all:unset;box-sizing:border-box;cursor:pointer;padding:30px 14px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end;gap:8px;min-height:190px;position:relative}
.hz:last-child{border-right:none}
.hz:hover{background:var(--sunk)}
.hz .bar{background:var(--navy);border-radius:4px 4px 0 0;width:100%;min-height:3px}
.hz.past .bar{background:var(--muted)}
.hz.unk .bar{background:repeating-linear-gradient(135deg,var(--line) 0 6px,transparent 6px 12px);border:1px solid var(--line)}
.hz b{font-size:26px;line-height:1}
.hz span{font-size:13px;color:var(--muted)}
.hz.now::after{content:"ปีนี้";position:absolute;top:10px;left:14px;font-size:11.5px;font-weight:600;color:var(--navy)}
.bars{display:flex;flex-direction:column;gap:6px}
.brow{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 36px;align-items:center;gap:10px;font-size:13.5px;padding:3px 4px;border-radius:6px}
.brow:hover{background:var(--sunk)}
.brow i{display:block;height:14px;border-radius:3px;background:var(--navy)}
.brow em{font-style:normal;text-align:right;font-weight:600}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px}
.meter{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--navy)}
.fu{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.fu:last-child{border-bottom:none}
.fu .d{font-weight:600}
.fu .m{color:var(--muted);font-size:13px}
.type{font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.type.Auto{background:var(--navy-l);color:var(--navy)}
.dashpad{padding:20px 24px 24px}
.dash{display:flex;flex-direction:column;gap:14px}
.dhd{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.dhd h1{margin:0;font-size:22px;line-height:1.2}
.seg2{display:flex;gap:2px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:9px;flex-wrap:wrap}
.seg2 button{border:none;background:transparent;font-size:13.5px;min-height:34px;padding:0 12px;border-radius:6px;cursor:pointer;color:var(--ink)}
.seg2 button[aria-pressed="true"]{background:var(--navy);color:#fff;font-weight:600}
:root[data-theme="dark"] .seg2 button[aria-pressed="true"]{color:#0F1A24}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .seg2 button[aria-pressed="true"]{color:#0F1A24} }
.kpis5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpis5 .kpi{padding:12px 16px}
.kpis5 .kpi b{font-size:28px}
.kpis5 .kpi b small{font-size:14px;font-weight:600;color:var(--muted)}
.kpi.warn{background:var(--red-l);border-color:var(--red)}
.dgrid2{display:grid;gap:14px;grid-template-columns:repeat(2,minmax(0,1fr)) minmax(300px,1fr);grid-template-rows:auto minmax(260px,1fr) auto;grid-template-areas:"hz hz fu" "pipe hot fu" "pipe hot gap"}
.a-hz{grid-area:hz}.a-pipe{grid-area:pipe}.a-hot{grid-area:hot}.a-fu{grid-area:fu}.a-gap{grid-area:gap}
.pn2{padding:14px 16px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.pn2>.scrollin{flex:1 1 auto}
.ph2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.ph2 h2{margin:0;font-size:15px}
.scrollin{min-height:0;overflow:auto}
.horizon2{display:grid;grid-template-columns:repeat(6,minmax(0,1fr)) 1.7fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;height:200px}
.horizon2 .hz{min-height:0;padding:28px 12px 10px}
.horizon2 .hz .bar{flex:0 0 auto}
.hz.unkbox{background:var(--amber-l);justify-content:center;gap:4px;border-right:none}
.hz.unkbox b{color:var(--amber);font-size:28px}
.hz.unkbox strong{color:var(--amber);font-size:13.5px}
.hz.unkbox span{color:var(--amber);font-size:12.5px;opacity:.85}
.brow i.won{background:var(--green)}
.brow i.lost{background:var(--muted)}
.hot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;padding:8px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.hot:last-child{border-bottom:none}
.hot .nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hot .sc{grid-row:span 2;align-self:center;font-size:20px;font-weight:700;color:var(--navy);text-align:right;line-height:1}
.hot .sc small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tg{font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.tg.u{background:var(--amber-l);color:var(--amber)}
.tg.b{background:var(--navy-l);color:var(--navy)}
.fu2{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.fu2:last-child{border-bottom:none}
.fu2 .d{font-weight:600}
.fu2 .n{display:block;text-decoration:none;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fu2 .m{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:120px minmax(0,1fr) 42px;align-items:center;gap:10px;font-size:13.5px;padding:3px 4px;border-radius:6px}
.mt:hover{background:var(--sunk)}
.mt b{text-align:right}
.mbar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--navy)}
.mbar i.mid{background:var(--amber)}
.mbar i.bad{background:var(--red)}
@media (min-width:1100px) and (min-height:720px){
  .dash{height:calc(100vh - 44px)}
  .dgrid2{flex:1;min-height:0;grid-template-rows:auto minmax(0,1fr) auto}
}
@media (min-width:1100px) and (max-height:840px){
  .horizon2{height:150px} .horizon2 .hz{padding-top:24px} .horizon2{--bh:40px}
  .kpis5 .kpi{padding:8px 14px} .kpis5 .kpi b{font-size:24px}
  .brow{padding:1px 4px} .pn2{padding:12px 14px}
}
@media (max-width:1100px){ .kpis5{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))} .dgrid2{grid-template-columns:1fr;grid-template-rows:none;grid-template-areas:"hz" "fu" "hot" "pipe" "gap"} .a-fu .scrollin,.a-hot .scrollin{max-height:420px} .horizon2{grid-template-columns:repeat(3,minmax(0,1fr));height:auto} .horizon2 .hz{min-height:130px} .horizon2 .unkbox{grid-column:1/-1} }
/* settings */
.stabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.stabs button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;color:var(--muted);font-size:14.5px;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.stabs button[aria-selected="true"]{color:var(--navy);font-weight:600;border-bottom-color:var(--navy)}
.stabs button:focus-visible{outline:2px solid var(--navy)}
.cnt{font-size:12px;background:var(--sunk);color:var(--muted);border-radius:10px;padding:0 7px;line-height:19px;font-weight:400}
.cfgforms{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px}
.li{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:40px;padding:0 12px;border-radius:7px;cursor:pointer;font-size:14px}
.li:hover{background:var(--sunk)}
.li.on{background:var(--navy-l);color:var(--navy);font-weight:600}
.tag{font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:4px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.new{background:var(--green-l);color:var(--green)}
.crow{display:grid;grid-template-columns:64px minmax(0,1fr) 170px 52px 40px;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.bc .crow,.crow.head.bc{grid-template-columns:64px minmax(0,1fr) 200px 150px 52px 40px}
.crow.head{font-size:12.5px;font-weight:600;color:var(--muted);background:var(--sunk)}
.crow.off .in{color:var(--muted)}
.crow.chg{background:var(--amber-l)}
.crow.new{background:var(--green-l)}
.mv{display:flex;gap:0}.mv .btn{min-height:30px;padding:0 6px;font-size:11px}
.warnt{color:var(--amber);margin-top:3px}
.switch{position:relative;display:inline-block;width:40px;height:24px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0;z-index:1}
.switch span{position:absolute;inset:0;border-radius:12px;background:var(--line);transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--navy)}
.switch input:checked+span::after{left:19px}
.switch input:focus-visible+span{outline:2px solid var(--navy);outline-offset:2px}
.switch input:disabled+span{opacity:.5}
.savebar{position:fixed;left:232px;right:0;bottom:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 28px calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.savebar .dot{width:9px;height:9px;border-radius:50%;background:var(--amber);flex:none}
.fitgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start;margin-bottom:10px}
.fitgrid .col{display:flex;flex-direction:column;gap:14px;min-width:0}
.fitc{padding:14px 16px}
.frow2{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:8px;align-items:center;padding:3px 0;font-size:13.5px}
.frow2.b3{grid-template-columns:minmax(0,1fr) auto 70px 30px}
.frow2.off{color:var(--muted)}
.in.num{width:64px;text-align:right;min-height:34px}
.fopt{display:grid;grid-template-columns:minmax(0,1fr) 64px 30px;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.fopt textarea{grid-column:1/-1;min-height:52px;font-size:13px}
.urow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 120px 170px 80px 52px 40px;gap:10px;align-items:start;padding:10px 18px;border-top:1px solid var(--line)}
.urow>*{align-self:center}
.urow.head{font-size:12.5px;font-weight:600;color:var(--muted);background:var(--sunk);padding:8px 18px}
.urow.off .in{color:var(--muted)}
.pchk{width:18px;height:18px;accent-color:var(--navy)}
.alertgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:16px;align-items:start}
.rulec.off{opacity:.65}

function fitScore(p) {
  const fit = S.data.config.fit, pick = (c, o) => { const r = fit.find(f => f.Criterion === c && f.Option === o); return r ? +r.Score : null; };
  const area = num(p.Required_Area_Min) ?? num(p.Current_Area_sqm);

  const growthKnown = growthYes || p.Business_Growth === 'Unknown' || p.Expansion === 'No';
  const s = {
    Location: p.Current_Zone ? pick('Location', p.Current_Zone) ?? 0 : null,
    Budget: budget,
    Industry: p.Industry_Category ? pick('Industry', p.Industry_Category) : null,
    Talent: p.Talent_Type ? pick('Talent', p.Talent_Type) : null,
    Brand: p.Brand_Type ? pick('Brand', p.Brand_Type) : null,
    Growth: growthKnown ? pick('Growth', growthYes ? 'Yes' : 'No') : null
  };
  const bonus = (p.ESG === 'Yes' ? 1 : 0) + (p.Bonus_Ecosystem === 'Yes' ? 1 : 0) + (p.Bonus_Referral === 'Yes' ? 1 : 0);
  const complete = Object.values(s).every(v => v != null);

function editDetail(text) {
  const val = v => /^\d{4}-\d{2}-\d{2}/.test(v) ? fmtD(v) : /^-?[1-9]\d*(\.\d+)?$/.test(v) && Math.abs(+v) >= 1000 ? fmtN(+v) : v;
  return `<ul class="fx" style="margin-top:4px">${String(text).split('\n').map(line => {
    const m = line.match(/^(.*?)([A-Za-z_][A-Za-z0-9_]*): (.*) → (.*)$/);
    if (!m) return `<li>${esc(line)}</li>`;
    return `<li>${esc(m[1])}${esc(LABEL[m[2]] || SUB_LABEL[m[2]] || m[2])}: <span class="muted">${esc(val(m[3]))}</span> → <b>${esc(val(m[4]))}</b></li>`;
  }).join('')}</ul>`;
}

function openDlg(html, onSubmit, opt = {}) {
  warmUp();
  const d = $('#dlg'); d.classList.toggle('wide', !!opt.wide); d.innerHTML = `<form class="dlg" method="dialog">${html}<div class="errbox hidden" id="dlgErr"></div><div class="dlg-foot"><button type="button" class="btn" data-act="closeDlg">${opt.cancel || 'ยกเลิก'}</button><button class="btn pri" value="ok">${opt.ok || 'บันทึก'}</button></div></form>`;
  d.oncancel = e => { if (d.dataset.busy) e.preventDefault(); };   // กำลังบันทึก → ปิดกล่องไม่ได้ กันกดซ้ำ
  d.querySelector('form').onsubmit = async e => { e.preventDefault(); const sb = e.target.querySelector('button[value="ok"]'), cb = e.target.querySelector('[data-act="closeDlg"]'); if (sb.disabled) return; sb.disabled = true; cb.disabled = true; d.dataset.busy = '1'; sb.textContent = 'กำลังบันทึก…'; try { const r = await onSubmit(new FormData(e.target)); delete d.dataset.busy; if (r !== false) d.close(); } catch (err) { delete d.dataset.busy; const b = $('#dlgErr'); b.textContent = err.message; b.classList.remove('hidden'); sb.disabled = false; cb.disabled = false; sb.textContent = opt.ok || 'บันทึก'; } };
  d.showModal(); const first = d.querySelector('input,select,textarea'); if (first) first.focus();
}

    async fd => {
      const st = fd.get('st'), lost = (fd.get('lost') || '').trim(), note = (fd.get('note') || '').trim();

      const ops = [{ sheet: 'Prospects', op: 'update', expect: p.Updated_At, row: { Company_ID: cid, Pipeline_Status: st, Lost_Reason: st === 'Lost' ? lost : p.Lost_Reason } },
        { sheet: 'Activity_Log', op: 'insert', row: { Log_ID: '$l', Company_ID: cid, Log_Type: 'Status Change', From_Status: p.Pipeline_Status, To_Status: st, Detail: [st === 'Lost' ? 'เหตุผล: ' + lost : '', note].filter(Boolean).join(' · ') } },
        ...statusSideOps(cid, st)];
      if (p.Pipeline_Status === 'Lost' && st !== 'Lost') ops.push(...autoAlertOps({ ...p, Pipeline_Status: st }, S.ix.actions[cid]));
      await commit(ops, 'เปลี่ยนสถานะเป็น ' + st + ' แล้ว'); route();
    });
}

async function actionUpdate(id, kind, days) {
  const a = S.data.actions.find(x => x.Action_ID === id); if (!a) return;
  const ops = [];
  if (kind === 'done') {
    ops.push({ sheet: 'Actions', op: 'update', row: { Action_ID: id, Status: 'Done', Completed_At: nowISO() } });
    ops.push({ sheet: 'Activity_Log', op: 'insert', row: { Log_ID: '$l', Company_ID: a.Company_ID, Log_Type: 'Follow-up Done', Detail: a.Message } });
  } else if (kind === 'snooze') {
    const base = a.Due_Date < todayISO() ? todayISO() : a.Due_Date;
    ops.push({ sheet: 'Actions', op: 'update', row: { Action_ID: id, Due_Date: addDays(base, +days), Note: 'เลื่อนจาก ' + fmtD(a.Due_Date) } });
  } else ops.push({ sheet: 'Actions', op: 'update', row: { Action_ID: id, Status: 'Cancelled', Completed_At: nowISO() } });
  await commit(ops, { done: 'ทำเครื่องหมายเสร็จแล้ว', snooze: 'เลื่อนไป ' + days + ' วันแล้ว', cancel: 'ยกเลิกแล้ว' }[kind]); route();
}

  if (!S.cfg || S.cfg.dataRef !== S.data) cfgInit();
  const d = S.cfg.draft;
  const tabs = [['forms', 'ตัวเลือกในฟอร์ม', EDIT_LISTS.length], ['fit', 'WP Fit Score', '6 หัวข้อ'], ['users', 'ผู้ใช้งานและสิทธิ์', d.users.length], ['alerts', 'การแจ้งเตือน', d.rules.length + ' กฎ']];
  shell('settings', `<div class="topline"><div style="flex:1"><h1>ตั้งค่า</h1><div class="sub">ทุกการแก้ไขบันทึกลง Google Sheet แท็บ Config</div></div></div>
  ${S.user.open ? '<div class="demo" style="margin-bottom:12px">ระบบยังไม่เปิด login ทุกคนที่เปิดเว็บแก้หน้านี้ได้ · ใส่อีเมล Admin ในแท็บผู้ใช้งานเพื่อเปิดใช้</div>' : ''}
  <nav class="stabs" role="tablist">${tabs.map(([k, l, n]) => `<button type="button" role="tab" data-act="cfgTab" data-v="${k}" aria-selected="${S.cfg.tab === k}">${l} <span class="cnt">${n}</span></button>`).join('')}</nav>
  <div id="cfgBody" style="padding-bottom:90px"></div><div id="cfgBar"></div>`);
  cfgRenderBody();
}
function cfgRenderBody() {
  const el = $('#cfgBody'); if (!el) return;
  el.innerHTML = { forms: cfgForms, fit: cfgFit, users: cfgUsers, alerts: cfgAlerts }[S.cfg.tab]();
  cfgRenderBar();
}
function cfgRenderBar() {
  const el = $('#cfgBar'); if (!el) return;
  if (!cfgDirty()) { el.innerHTML = ''; return; }
  const ch = cfgChanges();
  el.innerHTML = `<div class="savebar"><span class="dot"></span><span style="flex:1;min-width:0"><b>มีการแก้ไขที่ยังไม่บันทึก</b> <span class="hint">· ${esc(ch.join(' · ') || 'แก้ไขค่า')}</span></span><button type="button" class="btn" data-act="cfgReset">ยกเลิก</button><button type="button" class="btn pri" data-act="cfgSave">บันทึกการเปลี่ยนแปลง</button></div>`;
}
function cfgRenames() {
  const out = [];
  S.cfg.draft.lists.forEach(l => { if (l._o && l.Value !== l._o) out.push({ List: l.List, from: l._o, to: l.Value }); });
  S.cfg.draft.fit.filter(f => ['Talent', 'Brand'].includes(f.Criterion)).forEach(f => { if (f._o && f.Option !== f._o) out.push({ List: f.Criterion + '_Type', from: f._o, to: f.Option }); });
  return out;
}
function cfgChanges() {
  const o = JSON.parse(S.cfg.orig), d = S.cfg.draft, out = [];
  const rn = cfgRenames(); if (rn.length) out.push(`เปลี่ยนชื่อ ${rn.length} ตัวเลือก (มีผลกับ ${rn.reduce((a, r) => a + usageOf(r.List, r.from), 0)} บริษัท)`);
  const added = d.lists.filter(l => !l._o).length; if (added) out.push(`เพิ่มตัวเลือก ${added}`);
  const off = d.lists.filter(l => l._o && l.Active === 'No' && (o.lists.find(x => x.List === l.List && x.Value === l._o) || {}).Active !== 'No').length; if (off) out.push(`ปิดใช้งาน ${off}`);
  if (JSON.stringify(o.fit) !== cfgSig(d.fit)) out.push('แก้ WP Fit Score → คำนวณคะแนนใหม่ทั้งหมด');
  if (JSON.stringify(o.users) !== cfgSig(d.users)) out.push('แก้ผู้ใช้งาน');
  if (JSON.stringify(o.permissions) !== cfgSig(d.permissions)) out.push('แก้สิทธิ์');
  if (JSON.stringify(o.rules) !== cfgSig(d.rules)) out.push('แก้กฎแจ้งเตือน → ปรับวันเตือนทุกบริษัท');
  if (JSON.stringify(o.settings) !== cfgSig(d.settings)) out.push('แก้การส่งอีเมลรายวัน');
  return out;
}

// ----- แท็บ: ตัวเลือกในฟอร์ม -----
function cfgForms() {
  const d = S.cfg.draft, L = S.cfg.list, meta = EDIT_LISTS.find(x => x[0] === L) || EDIT_LISTS[0];
  const rows = d.lists.filter(l => l.List === L);
  const inds = [...new Set(d.fit.filter(f => f.Criterion === 'Industry').map(f => f.Option))];
  const left = EDIT_LISTS.map(([k, l]) => `<button type="button" class="li ${k === L ? 'on' : ''}" data-act="cfgList" data-v="${k}"><span>${l}</span><span class="cnt">${d.lists.filter(x => x.List === k && x.Active !== 'No').length}</span></button>`).join('')
    + `<div style="border-top:1px solid var(--line);margin:8px 0 6px"></div><div class="li" style="cursor:default"><span class="muted">สถานะดีล</span><span class="tag">ล็อก</span></div><div class="hint" style="padding:4px 12px">ล็อกไว้เพราะกฎ Lost / Closed Deal ผูกกับชื่อสถานะ</div>`;
  const zoneScore = z => { const f = d.fit.find(x => x.Criterion === 'Location' && x._zk === z._k); return f ? f.Score : 0; };
  const body = rows.map(r => {
    const i = idxOf('lists', r), used = usageOf(L, r._o), pos = rows.indexOf(r), renamed = r._o && r.Value !== r._o;
    return `<div class="crow ${r.Active === 'No' ? 'off' : ''} ${renamed ? 'chg' : ''} ${!r._o ? 'new' : ''}">
      <span class="mv"><button type="button" class="btn ghost sm" data-act="cfgMove" data-i="${i}" data-d="-1" ${pos === 0 ? 'disabled' : ''} aria-label="เลื่อนขึ้น">▲</button><button type="button" class="btn ghost sm" data-act="cfgMove" data-i="${i}" data-d="1" ${pos === rows.length - 1 ? 'disabled' : ''} aria-label="เลื่อนลง">▼</button></span>
      <div style="min-width:0">${cin(`lists.${i}.Value`, r.Value, { label: 'ชื่อตัวเลือก', rerender: 1 })}${renamed ? `<div class="hint warnt">เปลี่ยนชื่อจาก "${esc(r._o)}" · ข้อมูล ${used} บริษัทจะอัปเดตตามอัตโนมัติ</div>` : ''}</div>
      ${L === 'Business_Category' ? `<select class="in" data-cf="lists.${i}.Parent" aria-label="หมวดใหญ่">${inds.map(x => `<option ${x === r.Parent ? 'selected' : ''}>${esc(x)}</option>`).join('')}</select>` : ''}
      <span class="hint">${r._o ? `ใช้อยู่ ${used} บริษัท` : '<span class="tag new">ใหม่</span>'}${L === 'Zone' ? ` · Location ${zoneScore(r)}` : ''}</span>
      ${sw(`lists.${i}.Active`, r.Active !== 'No', 'เปิดใช้งาน ' + r.Value)}
      ${(!r._o || used === 0) ? `<button type="button" class="btn ghost sm" data-act="cfgDelList" data-i="${i}" aria-label="ลบ ${esc(r.Value)}">${ic('x').replace('<svg', '<svg width="16" height="16"')}</button>` : '<span></span>'}
    </div>`;
  }).join('');
  return `<div class="cfgforms"><div class="panel" style="padding:10px;align-self:start"><div class="hint" style="padding:4px 12px 8px">รายการตัวเลือก (dropdown)</div>${left}</div>
  <div class="panel" style="padding:0;min-width:0"><div style="display:flex;gap:12px;align-items:center;padding:16px 18px 10px;flex-wrap:wrap"><div style="flex:1"><h2 style="margin:0">${meta[1]}</h2><div class="hint">${esc(meta[2])}</div></div><button type="button" class="btn" data-act="cfgAddList">+ เพิ่มตัวเลือก</button></div>
  <div class="crow head ${L === 'Business_Category' ? 'bc' : ''}"><span></span><span>ชื่อตัวเลือก</span>${L === 'Business_Category' ? '<span>หมวดใหญ่ (Industry)</span>' : ''}<span>การใช้งาน</span><span>ใช้งาน</span><span></span></div>
  <div class="${L === 'Business_Category' ? 'bc' : ''}">${body}</div>
  <p class="hint" style="padding:12px 18px;margin:0">ตัวเลือกที่มีบริษัทใช้อยู่ลบไม่ได้ ให้ปิดใช้งานแทน · ตัวเลือกที่ปิดจะหายจากฟอร์ม แต่ข้อมูลเดิมยังอยู่และยังกรองค้นหาได้</p></div></div>`;
}

// ----- แท็บ: WP Fit Score -----
function cfgFit() {
  const d = S.cfg.draft;
  const zones = d.lists.filter(l => l.List === 'Zone');
  zones.forEach(z => { if (!d.fit.some(f => f.Criterion === 'Location' && f._zk === z._k)) d.fit.push({ Criterion: 'Location', Option: z.Value, Score: 0, Description: '', _zk: z._k, _k: nk() }); });
  const scoreIn = (f, label) => cin(`fit.${idxOf('fit', f)}.Score`, f.Score, { num: 1, cls: 'num', label: 'คะแนน ' + label });
  const card = (title, src, inner, extra = '') => `<section class="panel fitc"><div class="ph2"><h2>${title}</h2><span class="hint">${src}</span></div>${inner}${extra}</section>`;
  const loc = zones.map(z => { const f = d.fit.find(x => x.Criterion === 'Location' && x._zk === z._k); return `<div class="frow2 ${z.Active === 'No' ? 'off' : ''}"><span>${esc(z.Value)}</span>${scoreIn(f, z.Value)}</div>`; }).join('');
  const budget = d.fit.filter(f => f.Criterion === 'Budget').sort((a, b) => b.Option - a.Option);
  const lowest = Math.min(...budget.filter(f => +f.Option > 0).map(f => +f.Option));
  const bud = budget.map(f => `<div class="frow2 b3"><span class="hint">${+f.Option === 0 ? 'ต่ำกว่า' : '≥'}</span>${+f.Option === 0 ? `<span>${isFinite(lowest) ? fmtN(lowest) : ''}</span>` : cin(`fit.${idxOf('fit', f)}.Option`, f.Option, { num: 1, cls: 'num', label: 'พื้นที่ขั้นต่ำ', style: 'width:84px' })}${scoreIn(f, 'Budget')}${+f.Option === 0 ? '<span></span>' : `<button type="button" class="btn ghost sm" data-act="cfgDelFit" data-i="${idxOf('fit', f)}" aria-label="ลบช่วง">${ic('x').replace('<svg', '<svg width="14" height="14"')}</button>`}</div>`).join('');
  const simple = c => d.fit.filter(f => f.Criterion === c).map(f => `<div class="frow2"><span>${esc(c === 'Growth' ? (f.Option === 'Yes' ? 'มีแผนเติบโต / ขยาย' : 'ไม่มี / Unknown') : f.Option)}</span>${scoreIn(f, f.Option)}</div>`).join('');
  const people = c => d.fit.filter(f => f.Criterion === c).map(f => { const i = idxOf('fit', f), used = usageOf(c + '_Type', f._o); return `<div class="fopt">${cin(`fit.${i}.Option`, f.Option, { label: 'ตัวเลือก', rerender: 1 })}${scoreIn(f, f.Option)}${(!f._o || used === 0) ? `<button type="button" class="btn ghost sm" data-act="cfgDelFit" data-i="${i}" aria-label="ลบ">${ic('x').replace('<svg', '<svg width="14" height="14"')}</button>` : '<span></span>'}<textarea class="in" rows="2" data-cf="fit.${i}.Description" aria-label="คำอธิบาย" placeholder="คำอธิบายเกณฑ์ (แสดงใต้ dropdown ในฟอร์ม)">${esc(f.Description || '')}</textarea>${f._o && f.Option !== f._o ? `<div class="hint warnt" style="grid-column:1/-1">เปลี่ยนชื่อ · ข้อมูล ${used} บริษัทจะอัปเดตตาม</div>` : ''}</div>`; }).join('');
  const rec = d.fit.filter(f => f.Criterion === 'Recommend').sort((a, b) => b.Option - a.Option);
  const recH = rec.map(f => `<div class="frow2 b3">${cin(`fit.${idxOf('fit', f)}.Score`, f.Score, { label: 'อาคาร', style: 'font-weight:600' })}<span class="hint">${+f.Option === 0 ? 'ต่ำกว่า' : '≥'}</span>${+f.Option === 0 ? `<span style="text-align:right">${Math.min(...rec.filter(x => +x.Option > 0).map(x => +x.Option))}</span>` : cin(`fit.${idxOf('fit', f)}.Option`, f.Option, { num: 1, cls: 'num', label: 'คะแนนขั้นต่ำ' })}</div>`).join('');
  const max = fitMaxDraft();
  return `<div class="fitgrid">
    <div class="col">${card('Location Fit', 'จากโซน', loc, '<p class="hint" style="margin:8px 0 0">เพิ่ม/เปลี่ยนชื่อโซนที่แท็บตัวเลือกในฟอร์ม</p>')}${card('Growth Fit', 'จาก Business Growth', simple('Growth'))}</div>
    <div class="col">${card('Industry Fit', 'จาก Industry', simple('Industry'))}${card('Bonus', '+ เพิ่มจากคะแนนรวม', simple('Bonus'))}</div>
    <div class="col">${card('Budget Fit', 'จากพื้นที่ต้องการ (sqm)', bud, '<button type="button" class="btn ghost sm" data-act="cfgAddBudget" style="margin-top:6px">+ เพิ่มช่วง</button>')}${card('แนะนำอาคาร', 'คะแนนเต็ม ' + max, recH)}</div>
    <div class="col">${card('Talent Fit', 'เซลเลือก', people('Talent'), '<button type="button" class="btn ghost sm" data-act="cfgAddFit" data-v="Talent" style="margin-top:6px">+ เพิ่มตัวเลือก</button>')}${card('Brand Fit', 'เซลเลือก', people('Brand'), '<button type="button" class="btn ghost sm" data-act="cfgAddFit" data-v="Brand" style="margin-top:6px">+ เพิ่มตัวเลือก</button>')}</div>
  </div><p class="hint">บันทึกแล้วระบบจะคำนวณ Fit Score และอาคารแนะนำใหม่ให้ทุกบริษัททันที</p>`;
}
function fitMaxDraft() {
  const d = S.cfg.draft, mx = c => Math.max(0, ...d.fit.filter(f => f.Criterion === c).map(f => +f.Score || 0));
  return ['Location', 'Budget', 'Industry', 'Talent', 'Brand', 'Growth'].reduce((a, c) => a + mx(c), 0) + d.fit.filter(f => f.Criterion === 'Bonus').reduce((a, f) => a + (+f.Score || 0), 0);
}

  return `<section class="panel" style="padding:0;margin-bottom:16px"><div style="display:flex;gap:12px;align-items:center;padding:16px 18px 10px"><div style="flex:1"><h2 style="margin:0">ผู้ใช้งาน</h2><div class="hint">อีเมลใช้ login (OTP) และรับอีเมลแจ้งเตือน · "ผูกกับ Sales Owner" ใช้ตัดสินว่าบริษัทไหนเป็นของใคร</div></div><button type="button" class="btn" data-act="cfgAddUser">+ เพิ่มผู้ใช้</button></div>
    <div class="urow head"><span>อีเมล</span><span>ชื่อที่แสดง</span><span>บทบาท</span><span>ผูกกับ Sales Owner</span><span>ดีลที่ดูแล</span><span>ใช้งาน</span><span></span></div>${rows}</section>
  <section class="panel"><h2>สิทธิ์ตามบทบาท</h2><div class="tblwrap"><table><thead><tr><th>สิทธิ์</th><th style="text-align:center">Admin</th><th style="text-align:center">Manager</th><th style="text-align:center">Sales</th></tr></thead><tbody>${perm}</tbody></table></div>

// ----- แท็บ: การแจ้งเตือน -----
function cfgAlerts() {
  const d = S.cfg.draft, s = d.settings;
  const rules = d.rules.map((r, i) => {
    const off = +r.Offset_Months || 0, base = RULE_BASES.find(b => b[0] === r.Base_Field) || RULE_BASES[0];

    <div class="srow"><span>รวมรายการล่วงหน้า</span><span>${cin('settings.DIGEST_DAYS_AHEAD', s.DIGEST_DAYS_AHEAD, { num: 1, cls: 'num', label: 'จำนวนวัน' })} วัน</span></div>
    <div class="srow"><span>ส่งเฉพาะวันทำงาน (จ.–ศ.)</span>${sw('settings.DIGEST_WEEKDAYS_ONLY', s.DIGEST_WEEKDAYS_ONLY === 'Yes', 'เฉพาะวันทำงาน')}</div>
    <button type="button" class="btn" data-act="cfgTestMail" style="margin-top:10px" ${cfgDirty() ? 'disabled title="บันทึกก่อนทดสอบ"' : ''}>ส่งอีเมลทดสอบถึงตัวเอง</button>${cfgDirty() ? '<div class="hint">บันทึกการแก้ไขก่อนจึงจะทดสอบได้</div>' : ''}
  </section><section class="panel hint" style="line-height:1.6">บันทึกแล้วระบบจะสร้าง/เลื่อน/ยกเลิกวันเตือนของทุกบริษัทให้ตรงกฎใหม่ทันที · รายการที่เซลกด "เสร็จแล้ว" ไปแล้วจะไม่ถูกสร้างซ้ำ</section></div></div>`;
}

// ----- บันทึก -----
function cfgValidate() {
  const d = S.cfg.draft, errs = [];
  const seen = {};
  d.lists.forEach(l => { const v = String(l.Value || '').trim(); if (!v) errs.push('มีตัวเลือกที่ชื่อว่าง (' + l.List + ')'); const k = l.List + '|' + v.toLowerCase(); if (v && seen[k]) errs.push('ตัวเลือกซ้ำ: ' + v); seen[k] = 1; });
  ['Talent', 'Brand'].forEach(c => { const o = d.fit.filter(f => f.Criterion === c).map(f => String(f.Option).trim().toLowerCase()); if (o.some(x => !x)) errs.push(c + ': มีตัวเลือกที่ชื่อว่าง'); if (new Set(o).size !== o.length) errs.push(c + ': ตัวเลือกซ้ำ'); });
  d.fit.forEach(f => { if (f.Score === '' || isNaN(+f.Score)) { if (f.Criterion !== 'Recommend') errs.push(`คะแนน ${f.Criterion} ต้องเป็นตัวเลข`); } });
  const rec = d.fit.filter(f => f.Criterion === 'Recommend').map(f => +f.Option); if (new Set(rec).size !== rec.length) errs.push('เกณฑ์แนะนำอาคารซ้ำกัน');
  const bud = d.fit.filter(f => f.Criterion === 'Budget').map(f => +f.Option); if (new Set(bud).size !== bud.length) errs.push('ช่วง Budget ซ้ำกัน');
  const em = {}; d.users.forEach(u => { const e = String(u.Email || '').trim().toLowerCase(); if (e && !/^[^@\s]+@[^@\s]+$/.test(e)) errs.push('อีเมลไม่ถูกต้อง: ' + e); if (e && em[e]) errs.push('อีเมลซ้ำ: ' + e); em[e] = 1; });
  const orig = JSON.parse(S.cfg.orig);
  if (orig.users.some(u => u.Active === 'Yes' && u.Role === 'Admin' && u.Email) && !d.users.some(u => u.Active !== 'No' && u.Role === 'Admin' && String(u.Email).trim())) errs.push('ต้องมี Admin ที่เปิดใช้งานและมีอีเมลอย่างน้อย 1 คน');
  d.rules.forEach(r => { if (!String(r.Message_Template || '').trim()) errs.push('กฎ ' + r.Rule_ID + ' ยังไม่มีข้อความเตือน'); });
  return [...new Set(errs)];
}
function cfgPayload() {
  const d = S.cfg.draft, strip = o => Object.fromEntries(Object.entries(o).filter(([k]) => !k.startsWith('_')));
  const zones = d.lists.filter(l => l.List === 'Zone');
  const fit = [];
  zones.forEach(z => { const f = d.fit.find(x => x.Criterion === 'Location' && x._zk === z._k); fit.push({ Criterion: 'Location', Option: z.Value.trim(), Score: f ? +f.Score || 0 : 0, Description: '' }); });
  d.fit.filter(f => f.Criterion !== 'Location').forEach(f => fit.push({ Criterion: f.Criterion, Option: f.Criterion === 'Budget' || f.Criterion === 'Recommend' ? +f.Option : String(f.Option).trim(), Score: f.Criterion === 'Recommend' ? f.Score : +f.Score, Description: f.Description || '' }));
  // รายการ Talent/Brand ในฟอร์ม = ตัวเลือกในแท็บ Fit
  let lists = d.lists.filter(l => !['Talent_Type', 'Brand_Type'].includes(l.List)).map(l => ({ ...strip(l), Value: String(l.Value).trim() }));
  ['Talent', 'Brand'].forEach(c => d.fit.filter(f => f.Criterion === c).forEach(f => lists.push({ List: c + '_Type', Value: String(f.Option).trim(), Parent: '', Active: 'Yes' })));
  return { lists, fit, rules: d.rules.map(strip), users: d.users.map(u => ({ ...strip(u), Email: String(u.Email || '').trim().toLowerCase() })), permissions: d.permissions.map(strip), settings: { ...d.settings }, renames: cfgRenames() };
}
async function cfgSave() {
  const errs = cfgValidate();
  if (errs.length) { openDlg(`<h2>ยังบันทึกไม่ได้</h2><ul class="fx">${errs.map(e => `<li>${esc(e)}</li>`).join('')}</ul>`, async () => { }, { ok: 'ตกลง' }); return; }
  const ch = cfgChanges();
  openDlg(`<h2>ยืนยันบันทึกการตั้งค่า</h2><ul class="fx">${ch.map(c => `<li>${esc(c)}</li>`).join('') || '<li>แก้ไขค่า</li>'}</ul><p class="hint" style="margin:0">ระบบจะคำนวณ Fit Score และการเตือนใหม่ให้เบื้องหลังหลังบันทึก ประมาณ 10–30 วินาที (ระหว่างนั้นใช้งานต่อได้)</p>`, async () => {
    const payload = cfgPayload(), sb = $('#dlg button[value="ok"]');
    if (DEMO) applyConfigLocal(payload);
    else { await api('config_save', payload); sb.textContent = 'กำลังโหลดข้อมูลล่าสุด…'; _gen++; await loadData(); refreshLater(30000); }
    S.cfg = Object.assign(S.cfg, { dataRef: null }); toast('บันทึกการตั้งค่าแล้ว'); vSettings();
  }, { ok: 'ยืนยันบันทึก', cancel: 'กลับไปแก้ไข', wide: true });
}
function applyConfigLocal(p) {
  const map = { Zone: ['Current_Zone'], Building: ['Target_Building_1', 'Target_Building_2'], Sales_Owner: ['Sales_Owner'], Source: ['Source'], Agent: ['Agent'], Business_Category: ['Business_Category'], Country: ['Country_of_Origin'], Business_Growth: ['Business_Growth'], Talent_Type: ['Talent_Type'], Brand_Type: ['Brand_Type'] };
  p.renames.forEach(r => {
    (map[r.List] || []).forEach(f => S.data.prospects.forEach(x => { if (x[f] === r.from) x[f] = r.to; }));
    if (r.List === 'Role_in_Deal') S.data.contacts.forEach(c => { if (c.Role_in_Deal === r.from) c.Role_in_Deal = r.to; });
    if (r.List === 'Sales_Owner') S.data.actions.forEach(a => { if (a.Assigned_To === r.from) a.Assigned_To = r.to; });
  });
  S.data.config = { ...S.data.config, lists: p.lists, fit: p.fit, rules: p.rules, users: p.users.map(u => ({ ...u, HasEmail: !!u.Email })), permissions: p.permissions, settings: Object.entries(p.settings).map(([Setting, Value]) => ({ Setting, Value })) };
  S.data.prospects.forEach(x => { x.Industry_Category = industryOf(x.Business_Category) || x.Industry_Category; applyFit(x); });
  S.data = { ...S.data }; reindex();
}
Object.assign(ACT, {
  cfgTab: el => { S.cfg.tab = el.dataset.v; vSettings(); },
  cfgList: el => { S.cfg.list = el.dataset.v; cfgRenderBody(); },
  cfgReset: () => { S.cfg.dataRef = null; vSettings(); },
  cfgSave: () => cfgSave(),
  cfgMove: el => { const L = S.cfg.draft.lists, i = +el.dataset.i, row = L[i], same = L.filter(x => x.List === row.List), p = same.indexOf(row), q = p + (+el.dataset.d); if (q < 0 || q >= same.length) return; const j = L.indexOf(same[q]); [L[i], L[j]] = [L[j], L[i]]; cfgRenderBody(); },
  cfgAddList: () => { const L = S.cfg.draft.lists, list = S.cfg.list, last = L.map(x => x.List).lastIndexOf(list); const row = { List: list, Value: '', Parent: list === 'Business_Category' ? (S.cfg.draft.fit.find(f => f.Criterion === 'Industry') || {}).Option || '' : '', Active: 'Yes', _k: nk() }; L.splice(last + 1, 0, row); cfgRenderBody(); const ins = $$('#cfgBody .crow.new input.in'); if (ins.length) ins[ins.length - 1].focus(); },
  cfgDelList: el => { S.cfg.draft.lists.splice(+el.dataset.i, 1); cfgRenderBody(); },
  cfgDelFit: el => { S.cfg.draft.fit.splice(+el.dataset.i, 1); cfgRenderBody(); },
  cfgAddFit: el => { S.cfg.draft.fit.push({ Criterion: el.dataset.v, Option: '', Score: 1, Description: '', _k: nk() }); cfgRenderBody(); },
  cfgAddBudget: () => { S.cfg.draft.fit.push({ Criterion: 'Budget', Option: 1000, Score: 5, Description: '', _k: nk() }); cfgRenderBody(); },
  cfgAddUser: () => { S.cfg.draft.users.push({ Email: '', Name: '', Role: 'Sales', Sales_Owner_Name: '', Active: 'Yes', _k: nk() }); cfgRenderBody(); },
  cfgDelUser: el => { S.cfg.draft.users.splice(+el.dataset.i, 1); cfgRenderBody(); },
  cfgAddRule: () => { const R = S.cfg.draft.rules, n = R.reduce((m, r) => Math.max(m, +(String(r.Rule_ID).match(/\d+/) || [0])[0]), 0) + 1; R.push({ Rule_ID: 'R' + pad(n), Rule_Name: 'เตือนก่อนหมดสัญญา 6 เดือน', Base_Field: 'Lease_Expiry', Offset_Months: -6, Message_Template: 'Follow up as the company contract will expire in 6 months', Active: 'Yes', _new: 1, _k: nk() }); cfgRenderBody(); },
  cfgDelRule: el => { S.cfg.draft.rules.splice(+el.dataset.i, 1); cfgRenderBody(); },
  cfgTestMail: async el => { if (DEMO) { toast('โหมดเดโม: ส่งอีเมลทดสอบได้ในเวอร์ชันจริง'); return; } el.disabled = true; el.textContent = 'กำลังส่ง…'; try { const j = await getJSON(API_URL + '?action=test_digest' + (S.token ? '&token=' + encodeURIComponent(S.token) : '')); if (!j.ok) throw new Error(j.error); toast('ส่งอีเมลทดสอบไปที่ ' + j.sentTo + ' แล้ว'); } catch (e) { toast('ส่งไม่สำเร็จ: ' + e.message); } el.disabled = false; el.textContent = 'ส่งอีเมลทดสอบถึงตัวเอง'; }
});
// ช่องในหน้าตั้งค่า: อัปเดต draft ทันที
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.cf) { cfgSet(t.dataset.cf, t.dataset.bool ? (t.checked ? 'Yes' : 'No') : t.dataset.num ? (t.value === '' ? '' : +t.value) : t.value); cfgRenderBar(); }
  if (t.dataset.ruleamt != null || t.dataset.ruledir != null) { const i = +(t.dataset.ruleamt ?? t.dataset.ruledir), amt = +($(`[data-ruleamt="${i}"]`).value) || 0, dir = +($(`[data-ruledir="${i}"]`).value); S.cfg.draft.rules[i].Offset_Months = amt * dir; cfgRenderBar(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (!$('#cfgBody') || !$('#cfgBody').contains(t)) return;
  if (t.dataset.bool || t.dataset.rr || t.tagName === 'SELECT' || t.dataset.ruleamt != null || t.dataset.ruledir != null) { clearTimeout(S._rr); S._rr = setTimeout(() => { const y = window.scrollY; cfgRenderBody(); window.scrollTo(0, y); }, 0); }
});
window.addEventListener('beforeunload', e => { if (location.hash.startsWith('#/settings') && cfgDirty()) { e.preventDefault(); e.returnValue = ''; } });

/* ---------------- auth & boot ---------------- */
async function authCall(action, payload) {
  const j = await getJSON(API_URL + '?action=' + action + '&payload=' + encodeURIComponent(JSON.stringify(payload)));
  if (!j.ok) throw new Error(j.error);
  return j;
}
function signOut(msg) { S.token = null; store.set('pt_token', null); S.data = null; showLogin(msg); }
function showLogin(msg, step, email) {
  email = email || store.get('pt_email') || '';
  const e = msg ? `<div class="errbox" style="margin-bottom:14px;text-align:left">${esc(String(msg).replace(/^AUTH:\s*/, ''))}</div>` : '';
  $('#root').innerHTML = `<div class="panel login" style="text-align:left">
    <picture><source srcset="${LOGO.dark}" media="(prefers-color-scheme: dark)"><img src="${LOGO.light}" alt="Bhiraj Buri Group" style="width:170px;display:block;margin:0 0 18px" onerror="this.remove()"></picture>
    <h1 style="margin:0 0 4px;font-size:21px">เข้าสู่ระบบ Prospect Tenant</h1>
    ${step === 'code'
      ? `<p class="sub" style="margin:0 0 18px">ส่งรหัส 6 หลักไปที่ <b>${esc(email)}</b> แล้ว (ใช้ได้ 10 นาที)</p>${e}
         <form id="lf" class="grid" style="gap:12px"><label class="f">รหัสจากอีเมล<input class="in" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" style="font-size:22px;letter-spacing:6px;text-align:center"></label>
         <button class="btn pri">ยืนยัน</button>
         <div style="display:flex;justify-content:space-between"><button type="button" class="btn ghost sm" data-act="loginBack">เปลี่ยนอีเมล</button><button type="button" class="btn ghost sm" data-act="loginResend">ส่งรหัสใหม่</button></div></form>
         <p class="hint" style="margin:14px 0 0">ไม่เจออีเมล ลองดูในโฟลเดอร์ Junk/Spam</p>`
      : `<p class="sub" style="margin:0 0 18px">ใส่อีเมลบริษัท ระบบจะส่งรหัสไปให้ · ขอรหัสแค่ครั้งแรกของแต่ละเครื่อง</p>${e}
         <form id="lf" class="grid" style="gap:12px"><label class="f">อีเมล<input class="in" name="email" type="email" autocomplete="email" value="${esc(email)}"></label><button class="btn pri">ส่งรหัสเข้าสู่ระบบ</button></form>`}
  </div>`;
  const f = $('#lf'), first = f.querySelector('input'); first.focus();
  f.onsubmit = async ev => {
    ev.preventDefault(); const btn = f.querySelector('.btn.pri'); if (btn.disabled) return; btn.disabled = true; btn.textContent = 'กำลังดำเนินการ…';
    try {
      if (step === 'code') {
        const j = await authCall('otp_verify', { email, code: f.elements.code.value });
        S.token = j.token; store.set('pt_token', j.token); boot();
      } else {
        const em = f.elements.email.value.trim().toLowerCase(); if (!em) throw new Error('กรุณาใส่อีเมล');
        await authCall('otp_request', { email: em }); store.set('pt_email', em); showLogin('', 'code', em);
      }
    } catch (err) { showLogin(err.message, step, step === 'code' ? email : f.elements.email.value); }
  };
}
ACT.loginBack = () => showLogin('', 'email');
ACT.loginResend = async () => { const em = store.get('pt_email'); try { await authCall('otp_request', { email: em }); showLogin('', 'code', em); toast('ส่งรหัสใหม่แล้ว'); } catch (e) { showLogin(e.message, 'code', em); } };
async function boot() {
  if (DEMO) { const u = window.DEMO_DATA.config.users[1] || window.DEMO_DATA.config.users[0]; await loadData(); S.user = { name: u.Name, role: 'Sales', owner: u.Sales_Owner_Name }; S.user.perms = permsOf('Sales'); route(); return; }
  if (!API_URL) { $('#root').innerHTML = '<div class="panel login"><h1 style="font-size:20px;margin:0 0 8px">ยังไม่ได้ตั้งค่า</h1><p>ใส่ API_URL ที่ส่วนบนของไฟล์ index.html</p></div>'; return; }
  if (!S.token) S.token = store.get('pt_token');
  $('#root').innerHTML = '<div class="empty">กำลังโหลดข้อมูล…</div>';
  try { await loadData(); route(); }
  catch (e) { if (!String(e.message).startsWith('AUTH')) $('#root').innerHTML = `<div class="panel login"><div class="errbox">โหลดข้อมูลไม่สำเร็จ: ${esc(e.message)}</div><button class="btn" style="margin-top:12px" onclick="boot()">ลองอีกครั้ง</button></div>`; }
}
boot();
</script>
