<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prospect Tenant Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#EDF0F2; --surface:#FFFFFF; --sunk:#F6F7F8; --ink:#16212C; --muted:#56636F; --line:#D8DEE4;
  --navy:#1F4E78; --navy-d:#163A5A; --navy-l:#E3ECF5; --amber:#9A5B00; --amber-l:#FFF1DC; --red:#A63A1C; --red-l:#FBE7E1;
  --green:#226B45; --green-l:#E1F2E8;
  --r:10px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#11171D; --surface:#1A222B; --sunk:#151C23; --ink:#E7ECF1; --muted:#9AA7B4; --line:#2C3743;
  --navy:#7DB0E0; --navy-d:#A8CBEC; --navy-l:#1F3346; --amber:#F2B45A; --amber-l:#3A2C14; --red:#F08E70; --red-l:#3B2019; --green:#7CCB9D; --green-l:#17322A;
}}
:root[data-theme="dark"]{
  --ground:#11171D; --surface:#1A222B; --sunk:#151C23; --ink:#E7ECF1; --muted:#9AA7B4; --line:#2C3743;
  --navy:#7DB0E0; --navy-d:#A8CBEC; --navy-l:#1F3346; --amber:#F2B45A; --amber-l:#3A2C14; --red:#F08E70; --red-l:#3B2019; --green:#7CCB9D; --green-l:#17322A;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 'IBM Plex Sans Thai','Noto Sans Thai','Leelawadee UI',Tahoma,sans-serif;font-variant-numeric:tabular-nums}
a{color:var(--navy)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{font-weight:700;font-size:17px;padding:4px 10px 18px;line-height:1.3}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.nav a{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 12px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:14.5px}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--navy-l);color:var(--navy);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.badge{margin-left:auto;background:var(--red);color:#fff;border-radius:10px;font-size:12px;padding:0 7px;line-height:20px;font-weight:600}
.side-foot{margin-top:auto;font-size:13px;color:var(--muted);padding:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.main{min-width:0;padding:28px 32px 80px}
.topline{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.topline h1{margin:0;font-size:26px;line-height:1.25;font-weight:700;flex:1 1 auto}
.sub{color:var(--muted);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14.5px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
:root[data-theme="dark"] .btn.pri{color:#0F1A24}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn.pri{color:#0F1A24} }
.btn.pri:hover{background:var(--navy-d)}
.btn.sm{min-height:34px;padding:0 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel h2{margin:0 0 14px;font-size:16px;font-weight:700}
.grid{display:grid;gap:16px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13.5px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0F1A24}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0F1A24} }
.chips{display:flex;flex-wrap:wrap;gap:6px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:12px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-Prospected{background:var(--navy-l);color:var(--navy)}
.st-Inspected{background:#DFF0F0;color:#14605F}
.st-Follow-Up{background:#E8E5F7;color:#4A3F94}
.st-Negotiation{background:var(--amber-l);color:var(--amber)}
.st-Closed-Deal{background:var(--green-l);color:var(--green)}
.st-Lost{background:var(--red-l);color:var(--red)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .st-Inspected{background:#163332;color:#7FD3CF} :root:not([data-theme="light"]) .st-Follow-Up{background:#2A2644;color:#B9B0F2} }
:root[data-theme="dark"] .st-Inspected{background:#163332;color:#7FD3CF}
:root[data-theme="dark"] .st-Follow-Up{background:#2A2644;color:#B9B0F2}
label.f,.f{display:flex;flex-direction:column;gap:5px;min-width:0;font-size:13px;font-weight:600}
.in{width:100%;min-height:42px;padding:0 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:14.5px;font-weight:400}
textarea.in{padding:9px 11px;min-height:84px;resize:vertical}
.in.err{border-color:var(--red)}
.hint{font-size:12.5px;color:var(--muted);font-weight:400}
.req{color:var(--red)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--sunk);position:sticky;top:0}
th button{all:unset;cursor:pointer}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--sunk)}
.num{text-align:right}
.muted{color:var(--muted)}
.late{color:var(--red);font-weight:600}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:8px;font-size:14px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.demo{background:var(--amber-l);color:var(--amber);font-size:13px;padding:8px 12px;border-radius:8px;line-height:1.4}
dialog{border:none;border-radius:14px;padding:0;width:min(520px,calc(100vw - 32px));background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,20,30,.45)}
.dlg{padding:22px;display:flex;flex-direction:column;gap:14px}
.dlg h2{margin:0;font-size:18px}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.kpi:hover{border-color:var(--navy)}
.kpi b{font-size:30px;line-height:1.15;font-weight:700}
.kpi span{font-size:13.5px;color:var(--muted)}
.kpi.warn b{color:var(--red)}
.horizon{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.hz{all:unset;box-sizing:border-box;cursor:pointer;padding:30px 14px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:flex-end;gap:8px;min-height:190px;position:relative}
.hz:last-child{border-right:none}
.hz:hover{background:var(--sunk)}
.hz .bar{background:var(--navy);border-radius:4px 4px 0 0;width:100%;min-height:3px}
.hz.past .bar{background:var(--muted)}
.hz.unk .bar{background:repeating-linear-gradient(135deg,var(--line) 0 6px,transparent 6px 12px);border:1px solid var(--line)}
.hz b{font-size:26px;line-height:1}
.hz span{font-size:13px;color:var(--muted)}
.hz.now::after{content:"ปีนี้";position:absolute;top:10px;left:14px;font-size:11.5px;font-weight:600;color:var(--navy)}
.bars{display:flex;flex-direction:column;gap:6px}
.brow{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 36px;align-items:center;gap:10px;font-size:13.5px;padding:3px 4px;border-radius:6px}
.brow:hover{background:var(--sunk)}
.brow i{display:block;height:14px;border-radius:3px;background:var(--navy)}
.brow em{font-style:normal;text-align:right;font-weight:600}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:16px}
.meter{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--navy)}
.fu{display:grid;grid-template-columns:92px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.fu:last-child{border-bottom:none}
.fu .d{font-weight:600}
.fu .m{color:var(--muted);font-size:13px}
.type{font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.type.Auto{background:var(--navy-l);color:var(--navy)}
.dashpad{padding:20px 24px 24px}
.dash{display:flex;flex-direction:column;gap:14px}
.dhd{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.dhd h1{margin:0;font-size:22px;line-height:1.2}
.seg2{display:flex;gap:2px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:9px;flex-wrap:wrap}
.seg2 button{border:none;background:transparent;font-size:13.5px;min-height:34px;padding:0 12px;border-radius:6px;cursor:pointer;color:var(--ink)}
.seg2 button[aria-pressed="true"]{background:var(--navy);color:#fff;font-weight:600}
:root[data-theme="dark"] .seg2 button[aria-pressed="true"]{color:#0F1A24}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .seg2 button[aria-pressed="true"]{color:#0F1A24} }
.kpis5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpis5 .kpi{padding:12px 16px}
.kpis5 .kpi b{font-size:28px}
.kpis5 .kpi b small{font-size:14px;font-weight:600;color:var(--muted)}
.kpi.warn{background:var(--red-l);border-color:var(--red)}
.dgrid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);gap:14px}
.dleft,.dright{display:flex;flex-direction:column;gap:14px;min-height:0}
.dpair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;min-height:0}
.pn2{padding:14px 16px;display:flex;flex-direction:column;min-height:0}
.ph2{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px}
.ph2 h2{margin:0;font-size:15px}
.scrollin{min-height:0;overflow:auto}
.horizon2{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) 1.7fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;height:200px}
.horizon2 .hz{min-height:0;padding:28px 12px 10px}
.horizon2 .hz .bar{flex:0 0 auto}
.hz.unkbox{background:var(--amber-l);justify-content:center;gap:4px;border-right:none}
.hz.unkbox b{color:var(--amber);font-size:28px}
.hz.unkbox strong{color:var(--amber);font-size:13.5px}
.hz.unkbox span{color:var(--amber);font-size:12.5px;opacity:.85}
.brow i.won{background:var(--green)}
.brow i.lost{background:var(--muted)}
.hot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;padding:8px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.hot:last-child{border-bottom:none}
.hot .nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hot .sc{grid-row:span 2;align-self:center;font-size:20px;font-weight:700;color:var(--navy);text-align:right;line-height:1}
.hot .sc small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tg{font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.tg.u{background:var(--amber-l);color:var(--amber)}
.tg.b{background:var(--navy-l);color:var(--navy)}
.fu2{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.fu2:last-child{border-bottom:none}
.fu2 .d{font-weight:600}
.fu2 .n{display:block;text-decoration:none;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fu2 .m{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:120px minmax(0,1fr) 42px;align-items:center;gap:10px;font-size:13.5px;padding:3px 4px;border-radius:6px}
.mt:hover{background:var(--sunk)}
.mt b{text-align:right}
.mbar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--navy)}
.mbar i.mid{background:var(--amber)}
.mbar i.bad{background:var(--red)}
@media (min-width:1100px) and (min-height:720px){
  .dash{height:calc(100vh - 44px)}
  .dgrid2{flex:1;min-height:0}
  .dleft>.pn2:first-child{flex:0 0 auto}
  .dpair{flex:1}
  .dright>.pn2:first-child{flex:1}
}
@media (max-width:1100px){ .kpis5{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))} .dgrid2,.dpair{grid-template-columns:1fr} .horizon2{grid-template-columns:repeat(3,minmax(0,1fr));height:auto} .horizon2 .hz{min-height:130px} .horizon2 .unkbox{grid-column:1/-1} }
/* list */
.lay{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
.filters{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column;gap:16px}
.fgroup{display:flex;flex-direction:column;gap:7px}
.fgroup>.lbl{font-size:13px;font-weight:600}
.range{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cond{display:grid;grid-template-columns:1fr;gap:6px;padding:10px;border:1px dashed var(--line);border-radius:8px;position:relative}
.cond .x{position:absolute;top:4px;right:4px}
.resbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.resbar .count{font-size:18px;font-weight:700;margin-right:auto}
.active-f{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.af{font-size:12.5px;background:var(--navy-l);color:var(--navy);padding:3px 8px;border-radius:6px}
/* detail */
.dhead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:18px}
.dhead h1{margin:0 0 6px;font-size:26px;line-height:1.25}
.meta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;font-size:14px;color:var(--muted)}
.score{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:88px;padding:10px;border-radius:var(--r);background:var(--navy);color:#fff}
:root[data-theme="dark"] .score{color:#0F1A24}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .score{color:#0F1A24} }
.score b{font-size:28px;line-height:1}
.score span{font-size:12px;opacity:.9}
.score.none{background:var(--sunk);color:var(--muted)}
.dlay{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:16px;align-items:start}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px 20px}
.kv div{display:flex;flex-direction:column;font-size:14.5px;min-width:0;overflow-wrap:anywhere}
.kv dt{font-size:12.5px;color:var(--muted)}
.kv dd{margin:0}
dl{margin:0}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 16px 22px;font-size:14px}
.tl li::before{content:"";position:absolute;left:5px;top:8px;bottom:-4px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl li::after{content:"";position:absolute;left:0;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--navy)}
.tl .when{font-size:12.5px;color:var(--muted)}
.fitrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.fitrow:last-child{border-bottom:none}
.linkbtn{all:unset;cursor:pointer;color:var(--navy);font-size:13.5px;font-weight:600;text-decoration:none}
.linkbtn:hover{text-decoration:underline}
.linkbtn:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.fitsum{margin-top:12px;padding:14px 16px;border-radius:var(--r);background:var(--sunk);border:1px solid var(--line)}
.fithead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:10px}
.fithead .big{font-size:30px;font-weight:700;line-height:1}
.scale{position:relative;display:flex;gap:3px}
.scale .zone{display:flex;flex-direction:column;align-items:center;padding:6px 4px;border-radius:6px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--muted);min-width:0;text-align:center}
.scale .zone b{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.scale .zone.on{background:var(--navy-l);border-color:var(--navy);color:var(--navy)}
.scale .zone.on b{color:var(--navy)}
.scale .pin{position:absolute;top:-6px;bottom:-6px;width:3px;margin-left:-1px;background:var(--ink);border-radius:2px}
.guide{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.flash{box-shadow:0 0 0 3px var(--amber);transition:box-shadow .3s}
/* form */
.fsec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:16px;scroll-margin-top:16px}
.fsec h2{margin:0;font-size:17px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px 18px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:40px;padding:0 13px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#0F1A24}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#0F1A24} }
.auto{display:flex;align-items:center;gap:8px;min-height:42px;padding:0 11px;border-radius:8px;background:var(--navy-l);border:1px dashed var(--navy);color:var(--navy);font-size:14.5px;font-weight:500}
.warnbox{padding:10px 12px;border-radius:8px;background:var(--amber-l);color:var(--amber);font-size:13.5px;font-weight:400}
.errbox{padding:12px 14px;border-radius:8px;background:var(--red-l);color:var(--red);font-size:14px}
.rowcard{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--sunk)}
.rowcard .rh{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:14px}
.chk{display:flex;align-items:center;gap:8px;min-height:40px;font-size:14px;font-weight:400}
.chk input{width:18px;height:18px;accent-color:var(--navy)}
.flay{display:grid;grid-template-columns:200px minmax(0,1fr);gap:22px;align-items:start}
.fnav{position:sticky;top:16px;display:flex;flex-direction:column;gap:2px}
.fnav a{min-height:38px;display:flex;align-items:center;padding:0 12px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:14px}
.fnav a:hover{background:var(--surface)}
.fbar{grid-column:1/-1;position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:flex-end;margin:16px -32px -80px;z-index:4}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.hidden{display:none !important}
.login{max-width:420px;margin:12vh auto;padding:32px;text-align:center}
@media (max-width: 980px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:8px 10px;z-index:10;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line)}
  .brand{padding:0 8px;font-size:15px;white-space:nowrap}.brand small{display:none}
  .nav{display:flex;gap:2px}.nav a{white-space:nowrap;padding:0 10px}
  .side-foot{display:none}
  .main{padding:18px 16px 80px}
  .lay,.dlay,.flay{grid-template-columns:1fr}
  .filters{position:static;max-height:none}
  .fnav{display:none}
  .fbar{margin:16px -16px -80px}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}

<div id="root"></div>
<dialog id="dlg"></dialog>
<!--DEMO_DATA-->
<script>
/* ============ ตั้งค่า (สำหรับเวอร์ชันจริงบน GitHub Pages) ============ */
const API_URL = 'https://script.google.com/macros/s/AKfycbzL99K_ncSYwaKBj-oRsJTu9ovsgLtqTsO_7dW38n1kNYkR51nH1tmVUDCmXMnvys6kvQ/exec';    // URL ของ Apps Script Web App (…/exec)
const CLIENT_ID = '';  // Google OAuth Client ID
/* ==================================================================== */

const DEMO = !API_URL && typeof window.DEMO_DATA !== 'undefined';
const S = { dashOwner: null, data: null, user: null, token: null, filters: null, sort: { k: 'Company_Name', d: 1 }, alertTab: 'overdue', alertScope: 'mine', ix: {} };
const STATUSES = ['Sale Blitz', 'Prospected', 'Inspected', 'Follow-Up', 'Negotiation', 'Closed Deal', 'Lost'];
const CLOSED = ['Lost', 'Closed Deal'];
const TABLE = { Prospects: ['prospects', 'Company_ID', 'C'], Contacts: ['contacts', 'Contact_ID', 'P'], Financials: ['financials', 'Fin_ID', 'F'], Actions: ['actions', 'Action_ID', 'A'], Activity_Log: ['logs', 'Log_ID', 'L'] };
const LABEL = {
  Company_ID: 'รหัส', Company_Name: 'ชื่อบริษัท', Pipeline_Status: 'สถานะ', First_Contact_Date: 'ติดต่อครั้งแรก', Sales_Owner: 'Sales Owner', Source: 'Source', Agent: 'Agent', Lost_Reason: 'เหตุผลที่ Lost',
  Business_Category: 'Business Category', Industry_Category: 'Industry Category', Country_of_Origin: 'ประเทศต้นทาง', Year_Established: 'ปีที่ก่อตั้ง', Employees_TH: 'พนักงาน (ไทย)', Registered_Capital: 'ทุนจดทะเบียน',
  Has_Parent_Company: 'มีบริษัทแม่', BOI: 'BOI', Listed: 'Listed', ESG: 'ESG', Website: 'Website', LinkedIn: 'LinkedIn',
  Existing_Building: 'อาคารปัจจุบัน', Address: 'ที่อยู่', Current_Zone: 'โซนปัจจุบัน', Current_Area_sqm: 'พื้นที่ปัจจุบัน (sqm)', Occupied_Since: 'เช่าตั้งแต่', Lease_Expiry: 'วันหมดสัญญา', Expiry_Precision: 'ความแม่นยำวันหมดสัญญา',
  Required_Area_Min: 'พื้นที่ต้องการ ตั้งแต่', Required_Area_Max: 'พื้นที่ต้องการ ถึง', Business_Growth: 'Business Growth', Expansion: 'ขยายพื้นที่', Expansion_sqm: 'ขยาย (sqm)',
  Target_Building_1: 'อาคารเป้าหมาย 1', Target_Building_2: 'อาคารเป้าหมาย 2', Unit_Floor_Interested: 'Unit/Floor ที่สนใจ', Est_Rental_Rate: 'ราคาเสนอ (THB/sqm)', Rental_Rate_Note: 'หมายเหตุราคา',
  Talent_Type: 'Talent', Brand_Type: 'Brand', Bonus_Ecosystem: 'Bonus Ecosystem', Bonus_Referral: 'Bonus Referral', WP_Fit_Score: 'WP Fit Score', Recommended_Building: 'อาคารที่แนะนำ', Remark: 'Remark',
  Created_At: 'สร้างเมื่อ', Updated_At: 'แก้ไขล่าสุด', Created_By: 'สร้างโดย', Updated_By: 'แก้ไขโดย'
};
const NUM_F = ['Year_Established', 'Employees_TH', 'Registered_Capital', 'Current_Area_sqm', 'Required_Area_Min', 'Required_Area_Max', 'Expansion_sqm', 'Est_Rental_Rate', 'WP_Fit_Score'];
const DATE_F = ['First_Contact_Date', 'Occupied_Since', 'Lease_Expiry', 'Created_At', 'Updated_At'];

/* ---------------- helpers ---------------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayISO = () => iso(new Date());
const nowISO = () => { const d = new Date(); return iso(d) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); };
const parseD = s => s ? new Date(s.slice(0, 10) + 'T00:00:00') : null;
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return iso(d); };
function addMonths(s, m) { const d = parseD(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + m); const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); d.setDate(Math.min(day, last)); return iso(d); }
const fmtD = s => s ? s.slice(0, 10).split('-').reverse().join('/') : '';
const fmtN = n => (n == null || n === '') ? '' : Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 });
const num = v => (v === '' || v == null || isNaN(+v)) ? null : +v;
const norm = s => String(s || '').toUpperCase().replace(/\(.*?\)/g, '').replace(/\b(CO|LTD|LIMITED|COMPANY|INC|CORP|CORPORATION|PUBLIC|PCL|THAILAND|THE)\b/g, '').replace(/[^A-Z0-9ก-๙]/g, '');
const stCls = s => 'st st-' + String(s || '').replace(/\s+/g, '-');
const stTag = s => s ? `<span class="${stCls(s)}">${esc(s)}</span>` : '';
const lists = name => S.data.config.lists.filter(l => l.List === name).map(l => l.Value);
const industryOf = biz => (S.data.config.lists.find(l => l.List === 'Business_Category' && l.Value === biz) || {}).Parent || null;
function fmtExpiry(p) {
  if (!p.Lease_Expiry) return '';
  const [y, m] = p.Lease_Expiry.split('-');
  if (p.Expiry_Precision === 'Year') return y + ' (รู้แค่ปี)';
  if (p.Expiry_Precision === 'Month') return m + '/' + y;
  return fmtD(p.Lease_Expiry);
}
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } } };
const ICON = {
  dash: '<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>',
  list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  bell: '<path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>'
};
const ic = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

/* ---------------- data access ---------------- */
function reindex() {
  const d = S.data, ix = { p: {}, contacts: {}, fin: {}, actions: {}, logs: {} };
  d.prospects.forEach(p => ix.p[p.Company_ID] = p);
  const grp = (arr, key) => arr.forEach(r => (ix[key][r.Company_ID] = ix[key][r.Company_ID] || []).push(r));
  grp(d.contacts, 'contacts'); grp(d.financials, 'fin'); grp(d.actions, 'actions'); grp(d.logs, 'logs');
  S.ix = ix;
}
const pendingOf = cid => (S.ix.actions[cid] || []).filter(a => a.Status === 'Pending').sort((a, b) => a.Due_Date < b.Due_Date ? -1 : 1);
const nextFU = cid => pendingOf(cid)[0];
const isMine = a => !S.user.owner || a === S.user.owner;

async function api(action, payload) {
  let r;
  try { r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action, token: S.token, payload }) }); } catch (e) { throw new Error('ไม่มีอินเทอร์เน็ต หรือเชื่อมต่อ API ไม่ได้'); }
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('เชื่อมต่อ API ไม่ได้ (ตรวจสอบว่า Deploy แบบ Anyone และใช้ URL ล่าสุด)'); }
  if (!j.ok) { if (String(j.error).startsWith('AUTH')) { signOut(j.error); } throw new Error(j.error); }
  return j;
}
async function loadData() {
  if (DEMO) { if (!S.data) S.data = clone(window.DEMO_DATA); }
  else { const j = await api('bootstrap'); S.data = j.data; S.user = j.user; }
  reindex();
}
function applyOpsLocal(ops) {
  const idMap = {}, now = nowISO(), who = S.user.name;
  ops.forEach(o => {
    const [key, idK, pre] = TABLE[o.sheet]; const arr = S.data[key];
    const row = {}; Object.entries(o.row).forEach(([k, v]) => row[k] = (typeof v === 'string' && idMap[v]) ? idMap[v] : v);
    if (o.op === 'insert') {
      const ph = row[idK]; const max = arr.reduce((m, r) => Math.max(m, +(String(r[idK]).match(/\d+$/) || [0])[0]), 0);
      row[idK] = pre + String(max + 1).padStart(4, '0'); if (ph && String(ph)[0] === '$') idMap[ph] = row[idK];
      if (o.sheet === 'Prospects') Object.assign(row, { Created_At: now, Created_By: who, Updated_At: now, Updated_By: who });
      if (o.sheet === 'Actions') Object.assign(row, { Created_At: now, Created_By: row.Created_By || who });
      if (o.sheet === 'Activity_Log') Object.assign(row, { Logged_At: row.Logged_At || now, Logged_By: row.Logged_By || who });
      arr.push(row);
    } else if (o.op === 'update') {
      const cur = arr.find(r => r[idK] === row[idK]); if (!cur) throw new Error('ไม่พบ ' + row[idK]);
      if (o.sheet === 'Prospects') Object.assign(row, { Updated_At: now, Updated_By: who });
      Object.assign(cur, row);
    } else if (o.op === 'delete') {
      const i = arr.findIndex(r => r[idK] === row[idK]); if (i >= 0) arr.splice(i, 1);
    }
  });
  return idMap;
}
async function commit(ops, msg) {
  let idMap;
  if (DEMO) { idMap = applyOpsLocal(ops); reindex(); }
  else { const j = await api('save', { ops }); idMap = j.idMap || {}; await loadData(); }
  if (msg) toast(msg);
  return idMap;
}

/* ---------------- business rules ---------------- */
function fitScore(p) {
  const fit = S.data.config.fit, pick = (c, o) => { const r = fit.find(f => f.Criterion === c && f.Option === o); return r ? +r.Score : null; };
  const area = num(p.Required_Area_Min) ?? num(p.Current_Area_sqm);
  let budget = null;
  if (area != null) { const t = fit.filter(f => f.Criterion === 'Budget').sort((a, b) => b.Option - a.Option).find(f => area >= +f.Option); budget = t ? +t.Score : null; }
  const growthYes = (p.Business_Growth && p.Business_Growth !== 'Unknown') || p.Expansion === 'Yes';
  const growthKnown = growthYes || p.Business_Growth === 'Unknown' || p.Expansion === 'No';
  const s = {
    Location: p.Current_Zone ? pick('Location', p.Current_Zone) ?? 0 : null,
    Budget: budget,
    Industry: p.Industry_Category ? pick('Industry', p.Industry_Category) : null,
    Talent: p.Talent_Type ? pick('Talent', p.Talent_Type) : null,
    Brand: p.Brand_Type ? pick('Brand', p.Brand_Type) : null,
    Growth: growthKnown ? pick('Growth', growthYes ? 'Yes' : 'No') : null
  };
  const bonus = (p.ESG === 'Yes' ? 1 : 0) + (p.Bonus_Ecosystem === 'Yes' ? 1 : 0) + (p.Bonus_Referral === 'Yes' ? 1 : 0);
  const complete = Object.values(s).every(v => v != null);
  const total = complete ? Object.values(s).reduce((a, b) => a + b, 0) + bonus : null;
  return { s, bonus, complete, total };
}
function recommend(score) {
  if (score == null || score === '') return null;
  const r = S.data.config.fit.filter(f => f.Criterion === 'Recommend').sort((a, b) => b.Option - a.Option).find(f => +score >= +f.Option);
  return r ? r.Score : null;
}
function applyFit(p) {
  const f = fitScore(p);
  Object.assign(p, { Score_Location: f.s.Location, Score_Budget: f.s.Budget, Score_Industry: f.s.Industry, Score_Talent: f.s.Talent, Score_Brand: f.s.Brand, Score_Growth: f.s.Growth, Score_Bonus: f.bonus });
  if (f.complete) p.WP_Fit_Score = f.total;
  p.Recommended_Building = recommend(p.WP_Fit_Score);
  return f;
}
/* ----- WP Fit Score panel ----- */
// คำอธิบายเกณฑ์ (ร่าง — ให้ requester ยืนยัน แล้วแก้ข้อความตรงนี้ได้เลย)
const FIT_GUIDE = {
  'Executives / Professionals': 'พนักงานส่วนใหญ่เป็นผู้บริหารหรือสายวิชาชีพ เช่น ที่ปรึกษา การเงิน กฎหมาย',
  'Technology & Innovation Talent': 'พนักงานส่วนใหญ่เป็นวิศวกร นักพัฒนา หรือทีม R&D',
  'Staff / Workforce': 'พนักงานปฏิบัติการหรือ back office จำนวนมาก',
  'Global or Regional Brand': 'แบรนด์ข้ามชาติ หรือเป็นที่รู้จักระดับภูมิภาค',
  'Local Leading Brand': 'ผู้นำในตลาดไทย หรือเป็นที่รู้จักในอุตสาหกรรม',
  'Unknown Brand': 'ยังไม่เป็นที่รู้จัก หรือบริษัทขนาดเล็ก'
};
const fitGuide = c => `<span class="hint guide">${S.data.config.fit.filter(f => f.Criterion === c).map(f => `<span><b>${esc(f.Score)}</b> ${esc(f.Option)}${FIT_GUIDE[f.Option] ? ' — ' + esc(FIT_GUIDE[f.Option]) : ''}</span>`).join('')}</span>`;
const FIT_SRC = {
  Location: ['Current_Zone', 'เลือกโซนปัจจุบัน', p => p.Current_Zone],
  Budget: ['Required_Area_Min', 'ใส่พื้นที่ที่ต้องการ', p => { const a = num(p.Required_Area_Min) ?? num(p.Current_Area_sqm); return a == null ? '' : fmtN(a) + ' sqm' + (num(p.Required_Area_Min) == null ? ' (พื้นที่ปัจจุบัน)' : ''); }],
  Industry: ['Business_Category', 'เลือก Business Category', p => p.Industry_Category],
  Talent: ['Talent_Type', 'เลือก Talent', p => p.Talent_Type],
  Brand: ['Brand_Type', 'เลือก Brand', p => p.Brand_Type],
  Growth: ['Business_Growth', 'เลือก Business Growth', p => p.Business_Growth || (p.Expansion === 'Yes' ? 'มีแผนขยายพื้นที่' : '')]
};
function fitMax() {
  const fit = S.data.config.fit, max = c => Math.max(0, ...fit.filter(f => f.Criterion === c).map(f => +f.Score));
  return Object.keys(FIT_SRC).reduce((a, c) => a + max(c), 0) + fit.filter(f => f.Criterion === 'Bonus').length;
}
function fitPanel(p, mode) {
  const f = fitScore(p), keys = Object.keys(FIT_SRC), missing = keys.filter(k => f.s[k] == null);
  const legacy = !f.complete && p.WP_Fit_Score != null && num(p.WP_Fit_Score) != null;
  const shown = f.complete ? f.total : legacy ? +p.WP_Fit_Score : null;
  const rec = recommend(shown), max = fitMax();
  const rows = keys.map(k => {
    const [field, ask, src] = FIT_SRC[k], v = f.s[k], s = src(p);
    const right = v != null ? `<b>${v}</b>` : mode === 'form'
      ? `<button type="button" class="linkbtn" data-act="focusField" data-v="${field}">${ask} →</button>`
      : `<a href="#/edit/${p.Company_ID}" class="linkbtn">${ask} →</a>`;
    return `<div class="fitrow"><span>${k} Fit${s ? ` <span class="hint">· ${esc(s)}</span>` : ''}</span>${right}</div>`;
  }).join('');
  const bonusNames = [p.ESG === 'Yes' && 'ESG', p.Bonus_Ecosystem === 'Yes' && 'Ecosystem', p.Bonus_Referral === 'Yes' && 'Referral'].filter(Boolean);
  const progress = f.complete ? `ครบ 6 หัวข้อ` : `ครบ ${6 - missing.length} จาก 6 หัวข้อ · ขาด ${missing.join(', ')}`;
  // scale
  const cuts = S.data.config.fit.filter(x => x.Criterion === 'Recommend').map(x => ({ min: +x.Option, b: x.Score })).sort((a, b) => a.min - b.min);
  const zones = cuts.map((c, i) => ({ ...c, max: i < cuts.length - 1 ? cuts[i + 1].min - 1 : max }));
  const scale = `<div class="scale" aria-hidden="true">${zones.map(z => `<div class="zone ${rec === z.b ? 'on' : ''}" style="flex:${z.max - z.min + 1}"><b>${esc(z.b)}</b><small>${z.min}${z.max >= max ? '+' : '–' + z.max}</small></div>`).join('')}${shown != null ? `<i class="pin" style="left:${Math.min(100, shown / max * 100)}%"></i>` : ''}</div>`;
  const targets = [p.Target_Building_1, p.Target_Building_2].filter(Boolean);
  const recB = rec ? rec.split('/').map(s => s.trim()) : [];
  const mismatch = rec && targets.length && !targets.some(t => recB.includes(t));
  return `<div>${rows}<div class="fitrow"><span>Bonus${bonusNames.length ? ` <span class="hint">· ${bonusNames.join(', ')}</span>` : ''}</span><b>+${f.bonus}</b></div></div>
  <div class="fitsum">
    <div class="fithead"><div><span class="big">${shown ?? '–'}</span><span class="hint"> / ${max}</span>${legacy ? ' <span class="type">คะแนนเดิม</span>' : ''}</div><div style="text-align:right">${rec ? `แนะนำ <b>${esc(rec)}</b>` : '<span class="hint">ยังคำนวณไม่ได้</span>'}</div></div>
    ${scale}
    <div class="hint" style="margin-top:8px">${progress}${legacy ? ' · แสดงคะแนนเดิมจนกว่าจะครบ 6 หัวข้อ' : ''}</div>
  </div>
  ${mismatch ? `<div class="warnbox" style="margin-top:12px">ลูกค้าสนใจ <b>${esc(targets.join(', '))}</b> แต่คะแนนแนะนำ <b>${esc(rec)}</b> · ลองเสนอ ${esc(rec)} เพิ่มเติม</div>` : ''}`;
}

/** สร้าง op สำหรับ auto alert ตามกฎใน Config */
function autoAlertOps(p, existing) {
  const ops = [];
  S.data.config.rules.filter(r => r.Active === 'Yes').forEach(rule => {
    const base = p[rule.Base_Field];
    const due = base ? addMonths(base, +rule.Offset_Months) : null;
    const cur = (existing || []).filter(a => a.Rule_ID === rule.Rule_ID && a.Status === 'Pending');

const blankFilters = () => ({ q: '', status: [], owner: [], expYear: [], expWithin: '', curMin: '', curMax: '', reqMin: '', reqMax: '', zone: [], building: [], industry: [], source: [], fitMin: '', hasFU: '', conds: [] });

function exportCSV() {
  const cols = Object.keys(LABEL);
  const q = v => { const s = v == null ? '' : String(v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const csv = '\ufeff' + [cols.map(c => q(LABEL[c])).join(','), ...S.lastRows.map(p => cols.map(c => q(p[c])).join(','))].join('\n');
  if (DEMO) { toast('โหมดเดโม: ส่งออก CSV ได้ในเวอร์ชันจริง'); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'prospects_' + todayISO() + '.csv'; a.click();
}

async function actionUpdate(id, kind, days) {
  const a = S.data.actions.find(x => x.Action_ID === id); if (!a) return;
  const ops = [];
  if (kind === 'done') {
    ops.push({ sheet: 'Actions', op: 'update', row: { Action_ID: id, Status: 'Done', Completed_At: nowISO() } });
    ops.push({ sheet: 'Activity_Log', op: 'insert', row: { Log_ID: '$l', Company_ID: a.Company_ID, Log_Type: 'Follow-up Done', Detail: a.Message } });
  } else if (kind === 'snooze') {
    const base = a.Due_Date < todayISO() ? todayISO() : a.Due_Date;
    ops.push({ sheet: 'Actions', op: 'update', row: { Action_ID: id, Due_Date: addDays(base, +days), Note: 'เลื่อนจาก ' + fmtD(a.Due_Date) } });
  } else ops.push({ sheet: 'Actions', op: 'update', row: { Action_ID: id, Status: 'Cancelled', Completed_At: nowISO() } });
  await commit(ops, { done: 'ทำเครื่องหมายเสร็จแล้ว', snooze: 'เลื่อนไป ' + days + ' วันแล้ว', cancel: 'ยกเลิกแล้ว' }[kind]); route();
}

  const t = todayISO(), all = S.data.actions.filter(a => S.alertScope === 'all' || isMine(a.Assigned_To));
  const P = all.filter(a => a.Status === 'Pending');
  const groups = { overdue: ['เลยกำหนด', P.filter(a => a.Due_Date < t)], today: ['วันนี้', P.filter(a => a.Due_Date === t)], week: ['7 วันข้างหน้า', P.filter(a => a.Due_Date > t && a.Due_Date <= addDays(t, 7))], month: ['30 วันข้างหน้า', P.filter(a => a.Due_Date > t && a.Due_Date <= addDays(t, 30))], later: ['ทั้งหมดที่ค้าง', P], done: ['เสร็จ/ยกเลิก', all.filter(a => a.Status !== 'Pending')] };
  const [, rows] = groups[S.alertTab];
  rows.sort((a, b) => (a.Due_Date < b.Due_Date ? -1 : 1) * (S.alertTab === 'done' ? -1 : 1));
  shell('alerts', `
  <div class="topline"><h1>Follow-up</h1>${S.user.owner ? `<div class="chips"><button class="chip" data-act="scope" data-v="mine" aria-pressed="${S.alertScope === 'mine'}">ของฉัน</button><button class="chip" data-act="scope" data-v="all" aria-pressed="${S.alertScope === 'all'}">ทั้งทีม</button></div>` : ''}</div>
  <div class="tabs" role="tablist">${Object.entries(groups).map(([k, [l, r]]) => `<button class="chip" role="tab" data-act="atab" data-v="${k}" aria-selected="${S.alertTab === k}" aria-pressed="${S.alertTab === k}">${l} (${r.length})</button>`).join('')}</div>
  ${rows.length ? `<div class="tblwrap"><table><thead><tr><th>วันที่</th><th>บริษัท</th><th>ข้อความ</th><th>ประเภท</th><th>ผู้รับผิดชอบ</th><th></th></tr></thead><tbody>${rows.map(a => { const p = S.ix.p[a.Company_ID] || {}; const late = a.Status === 'Pending' && a.Due_Date < t; return `<tr><td class="${late ? 'late' : ''}" style="white-space:nowrap">${fmtD(a.Due_Date)}</td><td><a href="#/p/${a.Company_ID}">${esc(p.Company_Name || a.Company_ID)}</a><div>${stTag(p.Pipeline_Status)}</div></td><td>${esc(a.Message)}${a.Note ? `<div class="hint">${esc(a.Note)}</div>` : ''}</td><td><span class="type ${a.Action_Type}">${a.Action_Type}</span></td><td>${esc(a.Assigned_To || '')}</td><td style="white-space:nowrap">${a.Status === 'Pending' ? `<button class="btn sm" data-act="aDone" data-id="${a.Action_ID}">เสร็จแล้ว</button> <button class="btn sm" data-act="aSnooze" data-id="${a.Action_ID}" data-days="7">+7 วัน</button> <button class="btn sm ghost" data-act="aCancel" data-id="${a.Action_ID}">ยกเลิก</button>` : `<span class="muted">${a.Status === 'Done' ? 'เสร็จ' : 'ยกเลิก'} ${fmtD(a.Completed_At)}</span>`}</td></tr>`; }).join('')}</tbody></table></div>` : '<div class="panel empty">ไม่มีรายการในกลุ่มนี้</div>'}`);
}

/* ---------------- settings ---------------- */
function vSettings() {
  if (S.user.role !== 'Admin') { shell('dashboard', '<div class="panel empty">หน้านี้สำหรับ Admin</div>'); return; }
  const c = S.data.config, names = [...new Set(c.lists.map(l => l.List))];
  shell('settings', `<div class="topline"><div><h1>ตั้งค่า</h1><div class="sub">แก้ไขได้ที่ Google Sheet แท็บ Config แล้วรีเฟรชหน้านี้</div></div></div>
  <div class="dgrid" style="margin-top:0">
  <section class="panel"><h2>กฎการแจ้งเตือนอัตโนมัติ</h2>${c.rules.map(r => `<div class="fitrow"><span><b>${esc(r.Rule_Name)}</b><div class="hint">${esc(r.Message_Template)}</div></span><span>${r.Active === 'Yes' ? 'เปิด' : 'ปิด'}</span></div>`).join('')}</section>
  <section class="panel"><h2>ผู้ใช้งาน</h2>${c.users.map(u => `<div class="fitrow"><span>${esc(u.Name)} <span class="hint">${esc(u.Sales_Owner_Name || '')}</span></span><span>${esc(u.Role)}${u.Active === 'Yes' ? '' : ' (ปิด)'}</span></div>`).join('')}</section>
  <section class="panel"><h2>เกณฑ์ WP Fit Score</h2>${c.fit.map(f => `<div class="fitrow"><span>${esc(f.Criterion)} <span class="hint">${esc(f.Criterion === 'Budget' ? '≥ ' + f.Option + ' sqm' : f.Criterion === 'Recommend' ? '≥ ' + f.Option + ' คะแนน' : f.Option)}</span></span><b>${esc(f.Score)}</b></div>`).join('')}</section>
  ${names.map(n => `<section class="panel"><h2>${esc(n)}</h2><div class="chips">${lists(n).map(v => `<span class="chip" style="cursor:default">${esc(v)}</span>`).join('')}</div></section>`).join('')}
  </div>`);
}

/* ---------------- router & events ---------------- */
function route() {
  if (!S.data) return;
  const h = location.hash.replace(/^#\/?/, '') || 'dashboard', [pg, id] = h.split('/');
  if ($('#dlg').open) $('#dlg').close();
  ({ dashboard: vDashboard, list: vList, p: () => vDetail(id), new: () => vForm(null), edit: () => vForm(id), alerts: vAlerts, settings: vSettings }[pg] || vDashboard)();
  if (!['list'].includes(pg)) window.scrollTo(0, 0);
}
const ACT = {
  goActive: () => goList({ status: STATUSES.filter(s => !CLOSED.includes(s)), owner: S.dashOwner ? [S.dashOwner] : [] }),
  goAlertsOverdue: () => { S.alertTab = 'overdue'; S.alertScope = 'all'; location.hash = '#/alerts'; },
  goAlertsSoon: () => { S.alertTab = 'month'; S.alertScope = 'all'; location.hash = '#/alerts'; },
  goExp12: () => goList({ expWithin: '12', owner: S.dashOwner ? [S.dashOwner] : [] }),
  dashOwner: el => { S.dashOwner = el.dataset.v; vDashboard(); },
  goSqm: () => goList({ status: STATUSES.filter(s => !CLOSED.includes(s)), owner: S.dashOwner ? [S.dashOwner] : [], conds: [{ field: 'Required_Area_Min', op: 'filled', value: '' }] }),
  goHot: () => { S.sort = { k: 'WP_Fit_Score', d: -1 }; goList({ status: STATUSES.filter(s => !CLOSED.includes(s)), owner: S.dashOwner ? [S.dashOwner] : [] }); },
  goGap: el => goList({ status: STATUSES.filter(s => !CLOSED.includes(s)), owner: S.dashOwner ? [S.dashOwner] : [], conds: [{ field: el.dataset.v, op: 'empty', value: '' }] }),
  goFit25: () => goList({ fitMin: '25', owner: S.dashOwner ? [S.dashOwner] : [] }),
  goExpYear: el => goList({ expYear: [el.dataset.v], owner: S.dashOwner ? [S.dashOwner] : [] }),
  goExpLater: el => goList({ owner: S.dashOwner ? [S.dashOwner] : [], conds: [{ field: 'Lease_Expiry', op: 'after', value: el.dataset.v.slice(1) + '-12-31' }] }),
  goStatus: el => goList({ status: [el.dataset.v], owner: S.dashOwner ? [S.dashOwner] : [] }), goOwner: el => goList({ owner: [el.dataset.v], status: STATUSES.filter(s => !CLOSED.includes(s)) }),
  goBuilding: el => goList({ building: [el.dataset.v] }), goZone: el => goList({ zone: [el.dataset.v] }),
  fchip: el => { const k = el.dataset.k, v = el.dataset.v, a = S.filters[k]; const i = a.indexOf(v); i >= 0 ? a.splice(i, 1) : a.push(v); el.setAttribute('aria-pressed', i < 0); renderResults(); },
  clearF: () => { S.filters = blankFilters(); vList(); },
  saveF: () => openDlg(`<h2>บันทึกชุดตัวกรอง</h2><label class="f">ชื่อ<input class="in" name="n" placeholder="เช่น หมด 2028 บางนา 1,000+ sqm"></label>`, async fd => { const name = (fd.get('n') || '').trim(); if (!name) throw new Error('กรุณาตั้งชื่อ'); const s = store.get('savedFilters') || []; s.push({ name, f: clone(S.filters) }); store.set('savedFilters', s); vList(); toast('บันทึกชุดตัวกรองแล้ว'); }),
  loadSaved: el => { S.filters = Object.assign(blankFilters(), clone((store.get('savedFilters') || [])[+el.dataset.i].f)); vList(); },
  delSaved: el => { const s = store.get('savedFilters') || []; s.splice(+el.dataset.i, 1); store.set('savedFilters', s); vList(); },
  addCond: () => { S.filters.conds.push({ field: 'Current_Area_sqm', op: 'gte', value: '' }); vList(); },
  delCond: el => { S.filters.conds.splice(+el.dataset.i, 1); vList(); },
  sort: el => { const k = el.dataset.k; S.sort = { k, d: S.sort.k === k ? -S.sort.d : 1 }; renderResults(); },
  csv: exportCSV,
  dlgStatus: el => dlgStatus(el.dataset.id), dlgActivity: el => dlgActivity(el.dataset.id), dlgFU: el => dlgFU(el.dataset.id),
  closeDlg: () => $('#dlg').close(),
  setDate: el => { $('#dlg input[name="d"]').value = addDays(todayISO(), +el.dataset.n); },
  setDateISO: el => { $('#dlg input[name="d"]').value = el.dataset.v; if (!$('#dlg input[name="m"]').value) $('#dlg input[name="m"]').value = 'Follow up as the company contract will expire in 12 months'; },
  aDone: el => actionUpdate(el.dataset.id, 'done'), aSnooze: el => actionUpdate(el.dataset.id, 'snooze', el.dataset.days), aCancel: el => actionUpdate(el.dataset.id, 'cancel'),
  atab: el => { S.alertTab = el.dataset.v; vAlerts(); }, scope: el => { S.alertScope = el.dataset.v; vAlerts(); },
  seg: el => {
    const g = el.closest('[data-seg]'), multi = +g.dataset.multi || 0, on = el.getAttribute('aria-pressed') === 'true';
    if (multi) { if (!on && $$('[aria-pressed="true"]', g).length >= multi) { toast('เลือกได้สูงสุด ' + multi + ' อาคาร'); return; } el.setAttribute('aria-pressed', !on); }
    else { $$('button', g).forEach(b => b.setAttribute('aria-pressed', b === el)); }
    if (g.dataset.seg === 'prec') { const f = $('#pform').elements; f.exp_y.classList.toggle('hidden', el.dataset.v !== 'Year'); f.exp_m.classList.toggle('hidden', el.dataset.v !== 'Month'); f.exp_d.classList.toggle('hidden', el.dataset.v !== 'Exact'); }
    formLive();
  },
  addContact: () => { $('#contacts').insertAdjacentHTML('beforeend', contactHTML({ Is_Primary: $$('[data-row="contact"]').length ? 'No' : 'Yes' })); },
  addFin: () => { $('#fins').insertAdjacentHTML('beforeend', finHTML({})); },
  delRow: el => { el.closest('.rowcard').remove(); formLive(); },
  jump: (el, e) => { e.preventDefault(); document.getElementById(el.dataset.v).scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); },
  focusField: el => { const f = $('#pform').elements[el.dataset.v]; if (!f) return; f.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); setTimeout(() => f.focus({ preventScroll: true }), 300); f.classList.add('flash'); setTimeout(() => f.classList.remove('flash'), 1600); },
  signout: () => signOut()
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el) { if (el.tagName !== 'A' || el.dataset.act === 'jump') e.preventDefault?.(); ACT[el.dataset.act]?.(el, e); return; }
  const tr = e.target.closest('tr[data-href]'); if (tr && !e.target.closest('a,button')) location.hash = tr.dataset.href;
});
document.addEventListener('input', e => {
  const f = e.target.dataset.f; if (f) { S.filters[f] = e.target.value; renderResults(); return; }
  const c = e.target.dataset.cond; if (c && c === 'value') { S.filters.conds[+e.target.closest('.cond').dataset.i].value = e.target.value; renderResults(); }
});
document.addEventListener('change', e => {
  const c = e.target.dataset.cond;
  if (c === 'field' || c === 'op') { const cd = S.filters.conds[+e.target.closest('.cond').dataset.i]; cd[c] = e.target.value; if (c === 'field') { cd.op = OPS[fieldType(cd.field)][0][0]; cd.value = ''; } vList(); return; }
  if (e.target.dataset.f === 'expWithin') return;
  const ch = e.target.dataset.change;
  if (ch === 'asUser') { const u = S.data.config.users.find(x => x.Name === e.target.value); S.user = u ? { name: u.Name, role: u.Role, owner: u.Sales_Owner_Name } : { name: 'Admin', role: 'Admin', owner: '' }; S.alertScope = 'mine'; S.dashOwner = null; route(); }
  if (ch === 'dlgLost') $('#lostWrap').classList.toggle('hidden', e.target.value !== 'Lost');
});
window.addEventListener('hashchange', route);

/* ---------------- auth & boot ---------------- */
function signOut(msg) { S.token = null; try { sessionStorage.removeItem('idt'); } catch (e) { } S.data = null; showLogin(msg); }
function showLogin(msg) {
  $('#root').innerHTML = `<div class="panel login"><h1 style="margin:0 0 6px;font-size:22px">Prospect Tenant Platform</h1><p class="sub" style="margin:0 0 20px">เข้าสู่ระบบด้วยบัญชี Google ขององค์กร</p>${msg ? `<div class="errbox" style="margin-bottom:16px">${esc(msg.replace(/^AUTH:\s*/, ''))}</div>` : ''}<div id="gbtn" style="display:flex;justify-content:center"></div></div>`;
  const init = () => { google.accounts.id.initialize({ client_id: CLIENT_ID, callback: r => { S.token = r.credential; try { sessionStorage.setItem('idt', r.credential); } catch (e) { } boot(); } }); google.accounts.id.renderButton($('#gbtn'), { theme: 'outline', size: 'large', text: 'signin_with' }); };
  if (window.google?.accounts) init(); else { const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.onload = init; document.head.appendChild(s); }
}
async function boot() {
  if (DEMO) { const u = window.DEMO_DATA.config.users[1] || window.DEMO_DATA.config.users[0]; S.user = { name: u.Name, role: 'Sales', owner: u.Sales_Owner_Name }; await loadData(); route(); return; }
  if (!API_URL) { $('#root').innerHTML = '<div class="panel login"><h1 style="font-size:20px;margin:0 0 8px">ยังไม่ได้ตั้งค่า</h1><p>ใส่ API_URL และ CLIENT_ID ที่ส่วนบนของไฟล์ index.html</p></div>'; return; }
  if (!S.token) { try { S.token = sessionStorage.getItem('idt'); } catch (e) { } }
  if (CLIENT_ID && !S.token) { showLogin(); return; }
  $('#root').innerHTML = '<div class="empty">กำลังโหลดข้อมูล…</div>';
  try { await loadData(); route(); } catch (e) { if (!String(e.message).startsWith('AUTH')) $('#root').innerHTML = `<div class="panel login"><div class="errbox">โหลดข้อมูลไม่สำเร็จ: ${esc(e.message)}</div><button class="btn" style="margin-top:12px" onclick="boot()">ลองอีกครั้ง</button></div>`; }
}
boot();
</script>
</body>
</html>
